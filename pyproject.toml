[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maeron"
version = "0.1.0"
description = "Minecraft mod management and diagnostic tool"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
maeron = "maeron.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
